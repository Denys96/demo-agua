    ${row('Cuota fija ('+state.tarifa.incl+'m³):',fmt(c.base))}${row('Excedente '+c.exM3+'m³:',fmt(c.exc))}${row('Total del mes:',fmt(c.total),1)}

  const c=state.convenios.find(x=>x.id===_cid),monto=c.pagadas===c.n-1?c.saldo:c.cuota;
  const e=cobrarCaja({cat:'Cuota de convenio',desc:`Convenio #${c.id} · cuota ${c.pagadas+1}/${c.n}`,monto,metodo:$('#pm').value,acoId:c.aco,conv:c.id});

/* ---- Lógica compartida (oficina y fontanero) ---- */
function vincVale(serie,desc){const m=medMap[serie];let v=m.vale?state.despachos.find(x=>x.id===m.vale&&x.estado!=='anulado'):null;
  if(!v){v=addVale(serie,'Oficina (instalación directa)',{tipo:'directo',txt:desc},me(),HOY);v.hora=hora()}return v}
function doInstall(o){
  const m=medMap[o.serie];let num=o.socioNum;
  if(o.modo==='nuevo'){num=Math.max(...state.socios.map(s=>s.num))+1;addSocio(num,o.nombre,o.sector)}
  const s=socioMap[num],id=o.modo==='nuevo'?num+'-1':(o.reservedId||nextAcoId(num)),v=vincVale(o.serie,'Instalación directa '+id);
  addAco(num,+id.split('-')[1],s.nombre,s.sector,o.ubic,o.serie,0,true);
  const a=acoMap[id];a.anterior=o.ini;a.nueva=true;a.reciente=true;
  Object.assign(m,{lecturaInicio:o.ini,fechaInst:HOY,instalo:o.por,ubic:o.ubic});
  v.estado='confirmado';v.confirmo=o.por;v.acoId=id;
  if(o.sol){const so=state.solicitudes.find(x=>x.id===o.sol);so.estado='instalada';so.acoId=id;so.serie=o.serie}
  audit('Alta de acometida',`${id} · ${s.nombre} · medidor ${o.serie} INSTALADO (lectura inicial ${o.ini}) · vale ${v.id} autorizado por ${v.autorizo}`);
  return id;
}
function doBaja(acoId,ult,motivo){
  const a=acoMap[acoId],m=medMap[a.serie];
  m.estado='baja';m.bajaInfo={fecha:HOY,lectura:ult,motivo,aco:acoId};
  a.pendReemplazo={serie:m.serie,corte:ult,motivo,fecha:HOY};a.sinMedidor=true;a.reciente=true;
  state.reportes.filter(x=>x.aco===acoId&&x.estado==='pendiente').forEach(x=>x.estado='atendido');
  audit('Baja de medidor',`Acom ${acoId} · ${m.serie} DADO DE BAJA · última lectura ${ult} m³ · ${motivo}`,'alto');
}
function doReplaceLink(acoId,serie,ini,por){
  const a=acoMap[acoId],pr=a.pendReemplazo,m=medMap[serie],v=vincVale(serie,'Reemplazo en '+acoId);
  Object.assign(m,{estado:'instalado',aco:acoId,lecturaInicio:ini,fechaInst:HOY,instalo:por});
  v.estado='confirmado';v.confirmo=por;v.acoId=acoId;
  a.carry=(a.carry||0)+Math.max(0,pr.corte-a.anterior);a.anterior=ini;a.serie=serie;a.sinMedidor=false;a.reciente=true;delete a.pendReemplazo;
  state.cambios.push({aco:acoId,anterior:pr.serie,nuevo:serie,fecha:HOY,corte:pr.corte,inicio:ini,autorizo:v.autorizo,fontanero:v.fontanero,motivo:pr.motivo,vale:v.id});
  audit('Reemplazo de medidor',`Acom ${acoId}: ${pr.serie} → ${serie} · corte ${pr.corte} / inicio ${ini} · ${pr.motivo} · recibos y mora conservados`);
}
/* ---- Flujo 2: vincular medidor nuevo (nueva acometida) ---- */
function bNId(){const n=bv.n;if(n.modo==='nuevo')return Math.max(...state.socios.map(s=>s.num))+1+'-1';if(!n.socio)return null;const m=medMap[n.serie];return m&&m.dest&&m.dest.tipo==='socio'&&m.dest.ref===n.socio?m.dest.acoId:nextAcoId(n.socio)}
function bNMeter(serie){const n=bv.n,m=medMap[serie];n.serie=serie;
  if(m&&m.dest&&m.dest.tipo==='solicitud'){const so=state.solicitudes.find(x=>x.id===m.dest.ref);n.modo='nuevo';n.sol=so.id;n.nombre=so.nombre;n.sector=so.sector;n.ubic=so.dir}
  else if(m&&m.dest&&m.dest.tipo==='socio'){n.modo='existente';n.socio=m.dest.ref;n.q=String(m.dest.ref)}

   <div class="font-semibold mb-2">2 · Medidor</div><select onchange="bNMeter(this.value)" class="${IN}">${av2.slice(0,40).map(m=>`<option value="${m.serie}" ${n.serie===m.serie?'selected':''}>${mLabel(m)} · ${m.estado==='bodega'?'EN BODEGA':'DESPACHADO ('+m.fontanero+')'}</option>`).join('')||'<option value="">— sin medidores disponibles —</option>'}</select>

   <section class="lg:col-span-2 bg-white rounded-2xl border p-5 h-fit"><h2 class="font-bold mb-2">Últimas altas</h2>${state.acometidas.filter(a=>a.nueva).slice(-6).reverse().map(a=>`<div class="border rounded-xl p-2.5 mb-2 text-sm"><b>${a.id}</b> · ${a.nombre}<div class="text-xs text-slate-500">${a.serie} · lectura inicial ${a.anterior} · ${a.dir}</div></div>`).join('')||'<div class="text-xs text-slate-400">Aún no hay altas en esta sesión.</div>'}
   <div class="text-xs text-slate-500 mt-3">El derecho de acometida se cobra en <b>Caja → Otros cobros</b> y genera la solicitud.</div></section></div>`;
  if(n.modo==='existente')bNSearch();

function bNSave(){

  const v=state.despachos.find(x=>x.id===fv.inst),m=medMap[v.serie],rep=v.dest.tipo==='reemplazo',a=rep?acoMap[v.dest.acoId]:null,blocked=rep&&!a.pendReemplazo;
  $('#fbody').innerHTML=fHead('Vale '+v.id,'Confirmar instalación','renderFInst()')+`<div class="p-4 space-y-4"><div class="bg-white rounded-2xl p-4 border text-sm"><div><b class="mono text-lg">${v.serie}</b> · ${m.marca} ${m.diam}</div><div class="text-slate-500">${v.dest.txt}</div></div>
   ${blocked?`<div class="bg-amber-50 border border-amber-300 text-amber-800 rounded-2xl p-4 text-sm font-semibold">⏳ La oficina aún no registró la baja del medidor anterior de ${a.id}. Espere a que se complete el Paso 1.</div>`
   :`${rep?`<div class="bg-slate-100 rounded-2xl p-3 text-sm">Medidor retirado: <b class="mono">${a.pendReemplazo.serie}</b> · última lectura ${a.pendReemplazo.corte} m³ · ${a.pendReemplazo.motivo}</div>`:`<div><label class="text-sm font-semibold">Ubicación / referencia</label><input value="${esc(fv.ubicI)}" oninput="fv.ubicI=this.value" class="w-full border rounded-xl px-3 py-3 mt-1" placeholder="Casa esquina, portón azul"></div>`}
   <div><label class="text-sm font-semibold">Lectura inicial del medidor (m³)</label><input type="number" min="0" value="${fv.ini}" oninput="fv.ini=this.value" class="w-full border-2 border-sky-400 rounded-xl px-3 py-3 mt-1 text-2xl font-bold mono"></div>
   ${fotoBtn('finst','Tomar foto de instalación')}<button onclick="fInstConfirm()" class="w-full py-5 rounded-2xl text-lg font-bold text-white bg-emerald-600 active:bg-emerald-700 shadow">✅ Confirmar instalación</button>`}</div>`;
}
function fInstConfirm(){
  const v=state.despachos.find(x=>x.id===fv.inst),rep=v.dest.tipo==='reemplazo',ini=parseInt(fv.ini,10);let msg;
  if(isNaN(ini)||ini<0){toast('⚠️ Lectura inicial inválida');return}
  if(!bv.f.finst){toast('⚠️ Tome la foto de instalación');return}
  if(rep){doReplaceLink(v.dest.acoId,v.serie,ini,USERS.fontanero);msg=`✅ ${v.serie} instalado en ${v.dest.acoId}`}
  else{if(!fv.ubicI.trim()){toast('⚠️ Indique ubicación / referencia');return}
    let o;if(v.dest.tipo==='solicitud'){const so=state.solicitudes.find(x=>x.id===v.dest.ref);o={modo:'nuevo',nombre:so.nombre,sector:so.sector,sol:so.id}}else o={modo:'existente',socioNum:v.dest.ref,reservedId:v.dest.acoId};
    msg=`✅ Acometida ${doInstall({...o,serie:v.serie,ini,ubic:esc(fv.ubicI.trim()),por:USERS.fontanero})} instalada`}
  bv.f.finst=null;toast(msg+' · ya está en su ruta');renderFInst();
}
function fDanoModal(){const a=acoMap[fv.sel];bv.f.dano=null;
  modal(`<h3 class="text-xl font-bold mb-1">⚠️ Reportar medidor dañado</h3><div class="text-sm text-slate-500 mb-3">Acom ${a.id} · <span class="mono">${a.serie}</span></div>
   <label class="text-sm font-semibold">Motivo</label><select id="dmot" class="w-full border rounded-xl px-3 py-3 mt-1 mb-3">${MOTIVOS.map(x=>`<option>${x}</option>`).join('')}</select>
   <label class="text-sm font-semibold">Lectura observada (opcional)</label><input id="dlec" type="number" class="w-full border rounded-xl px-3 py-3 mt-1 mb-3">${fotoBtn('dano','Foto del daño')}
   <div class="flex gap-3"><button onclick="closeModal()" class="flex-1 py-3.5 rounded-xl bg-slate-100 font-semibold">Cancelar</button><button onclick="fDanoSave()" class="flex-1 py-3.5 rounded-xl bg-red-600 text-white font-bold">Enviar reporte</button></div>`);
}
function fDanoSave(){
  const a=acoMap[fv.sel];
  if(state.reportes.find(x=>x.aco===a.id&&x.estado==='pendiente')){toast('Ya existe un reporte pendiente para '+a.id);closeModal();return}
  if(!bv.f.dano){toast('⚠️ Tome la foto del daño');return}
  const r={id:'R-'+String(++state.seq.rep).padStart(4,'0'),aco:a.id,serie:a.serie,motivo:$('#dmot').value,lectura:$('#dlec').value,fecha:HOY,hora:hora(),por:FUSER,estado:'pendiente'};
  state.reportes.push(r);audit('Reporte de daño',`${r.id} · Acom ${a.id} · ${a.serie} · ${r.motivo}`);
  bv.f.dano=null;closeModal();toast('📨 Reporte enviado a oficina (Bodega → Reemplazo de medidor)');
}

/* ============================ INICIO ============================ */
renderNav();renderView();
</script>
</body>
</html>
